# pwnguard.yaml
# PwnGuard configuration: AI-powered security audit

# Minimum severity to block commits/merges
# Options: CRITICAL, HIGH, MEDIUM, LOW, INFO
severity_threshold: HIGH

# Default AI backend for this project. Overrides auto-detection (which
# would pick claude-code locally, claude-api/ollama in CI). Comment out
# to fall back to the auto-detect behaviour. CLI flag --backend always
# wins. Personal override: pwnguard.local.yaml (gitignored).
# Options: claude-code, ollama, claude-api, openai-compat
# backend: openai-compat

# Claude Code CLI settings (local, uses Pro subscription)
# Default backend for local development
claude_code:
  timeout: 120  # seconds

# Claude API settings (requires ANTHROPIC_API_KEY)
# Only needed if your org has API access
claude_api:
  model: claude-sonnet-5
  max_tokens: 8192  # output budget; raise when thinking is on
  thinking: disabled  # disabled, adaptive (4.6+), enabled (4.5 and older)

# Ollama settings (local LLM, free, offline)
# Default backend for CI (self-hosted runner)
ollama:
  model: qwen2.5-coder:7b
  url: http://localhost:11434
  # Only localhost is allowed by default. true lets diffs leave the host.
  allow_remote: false
  timeout: 600  # seconds; raise for very large diffs

  keep_alive: "30m"   # keep model in VRAM between scans
  num_ctx: 8192       # context window; 8k fits 7B + KV cache in 8GB VRAM
  num_predict: 2048   # cap on output tokens
  temperature: 0.5    # lower = more deterministic
  seed: 42            # pin RNG for reproducible runs (any int)

# OpenAI-compatible endpoint (LiteLLM, vLLM, OpenRouter, Groq, llama.cpp, etc.)
# Use --backend openai-compat. Requires OPENAI_API_KEY env var (never the yaml).
# openai:
#   url: https://litellm.example.com  # base URL; /v1/chat/completions appended
#   model: qwen3-coder-480b
#   timeout: 600
#   api_key_env: OPENAI_API_KEY  # override if your project uses a different name
#   num_predict: 4096   # max output tokens (maps to OpenAI's max_tokens)
#   temperature: 0.5
#   seed: 42

# GitLab MR comment posting (--mode ci --mr-diff). Controls how findings
# are posted back to the merge request; needs GITLAB_TOKEN (or CI_JOB_TOKEN).
gitlab:
  # true  = post findings as a resolvable discussion thread - it must be
  #         resolved before merge when the project requires resolved threads
  # false = post as a plain, non-resolvable note
  comment_as_thread: true
  # true  = wrap the finding detail in a collapsed <details> block; the
  #         heading and severity tally stay visible above it
  # false = full inline comment
  comment_collapsed: true

# File patterns to skip (glob syntax)
ignore_patterns:
  - "*.min.js"
  - "*.min.css"
  - "*.lock"
  - "*.map"
  - "vendor/*"
  - "node_modules/*"
  - "*.test.php"
  - "*.spec.js"
  - "*.spec.ts"
  - "migrations/*"
  - "tests/*"
  - "Test/*"

# Only scan these file extensions (empty = scan all)
language_focus:
  - php
  - js
  - ts
  - twig
  - html
  - py

# Maximum diff size (lines) before truncation
max_diff_lines: 500

# Maximum single file size (KB) to include
max_file_size_kb: 100

# Monitor mode: when invoked with --monitor PwnGuard opens a TUI
# dashboard that watches these repos, audits every new commit between
# the last scanned revision and HEAD (one per commit), and lets you
# step through findings without re-running the audit. State is cached
# in .pwnguard-monitor.json in the current working directory.
# Uncomment and adapt:
#
# monitor:
#   repos:
#     - name: api-server
#       url: https://gitlab.com/group/api-server
#       branch: main
#     - name: vendor-fork
#       url: https://github.com/owner/repo
#       branch: upstream
#   review_everything_at_once: true  # one refresh reviews all new changes (off: one batch per [r])
#   max_commits_per_refresh: 10   # batch size per [r]; also the cap when review_everything_at_once is off
#   keep_commits: 30              # retained audited commits per repo before pruning oldest
