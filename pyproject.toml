[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pwnguard"
dynamic = ["version"]
description = "AI-powered security review for git workflows"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Shiva Kerdel" }]
dependencies = ["pyyaml>=6,<7"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
]

[project.optional-dependencies]
claude-api = ["anthropic>=0.40,<1.0"]
dev = ["pytest>=9,<10", "build", "twine"]

[project.urls]
Homepage = "https://github.com/s-kerdel/PwnGuard"
Source = "https://github.com/s-kerdel/PwnGuard"
Issues = "https://github.com/s-kerdel/PwnGuard/issues"

[project.scripts]
pwnguard = "pwnguard.cli:main"

[tool.hatch.version]
path = "pwnguard/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["pwnguard"]

[tool.hatch.build.targets.wheel.force-include]
"pwnguard/data/pre-commit" = "pwnguard/data/pre-commit"
